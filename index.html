<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JujuLand — The Living Canvas (home page prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Shantell+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --slide-ms: 20000ms;   /* spec: crossfade to next featured piece after ~20s */
    --fade-ms: 1800ms;     /* crossfade length */
    --chrome: rgba(251,246,236,.92);
    --ink: #fbf6ec;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden; background:#0d0b09}
  body{font-family:"Shantell Sans", system-ui, sans-serif; color:var(--ink)}

  /* ---------- stage ---------- */
  .stage{position:fixed; inset:0}
  .slide{
    position:absolute; inset:0; opacity:0; pointer-events:none;
    transition:opacity var(--fade-ms) ease-in-out;
  }
  .slide.active{opacity:1; pointer-events:auto; cursor:pointer}
  .slide img{
    width:100%; height:100%; object-fit:cover; object-position:center;
    transform-origin:var(--ox,50%) var(--oy,50%);
  }
  /* Ken Burns drift — runs for the full display duration */
  .slide.active img{animation:kenburns calc(var(--slide-ms) + var(--fade-ms)) linear forwards}
  @keyframes kenburns{
    from{transform:scale(1.0) translate(0,0)}
    to  {transform:scale(1.12) translate(var(--tx,1.5%), var(--ty,-1.5%))}
  }
  /* gentle vignette so chrome stays readable without touching the art */
  .vignette{position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,.38), transparent 22%),
               linear-gradient(to bottom, rgba(0,0,0,.22), transparent 14%)}

  /* ---------- chrome (fades when idle) ---------- */
  .chrome{transition:opacity .6s ease}
  body.idle .chrome{opacity:.08}
  body.idle{cursor:none}

  .wordmark{
    position:fixed; top:18px; left:22px; z-index:20;
    font-family:Caveat,cursive; font-size:1.9rem; font-weight:700;
    text-shadow:0 1px 8px rgba(0,0,0,.5); letter-spacing:.02em;
  }
  .caption{
    position:fixed; left:24px; bottom:20px; z-index:20; cursor:pointer;
    text-shadow:0 1px 10px rgba(0,0,0,.65);
  }
  .caption .t{font-family:Caveat,cursive; font-size:2rem; font-weight:700; line-height:1}
  .caption .m{font-size:.8rem; opacity:.85; margin-top:2px}
  .caption:hover .t{text-decoration:underline; text-decoration-style:wavy; text-underline-offset:6px}

  .controls{
    position:fixed; right:22px; bottom:18px; z-index:20;
    display:flex; gap:10px; align-items:center;
  }
  .btn{
    width:44px; height:44px; border-radius:50%;
    border:2px solid var(--chrome); background:rgba(20,16,12,.35);
    color:var(--ink); font-size:1.05rem; cursor:pointer;
    backdrop-filter:blur(4px); transition:background .2s, transform .15s;
    display:grid; place-items:center;
  }
  .btn:hover{background:rgba(20,16,12,.6); transform:scale(1.08)}
  .btn:disabled{opacity:.25; cursor:default; transform:none}

  .navglyph{
    position:fixed; top:16px; right:20px; z-index:20;
    font-family:Caveat,cursive; font-size:1.1rem; font-weight:700;
    border:2px solid var(--chrome); border-radius:999px;
    padding:6px 18px; background:rgba(20,16,12,.35); color:var(--ink);
    cursor:pointer; backdrop-filter:blur(4px); transition:background .2s, transform .15s;
  }
  .navglyph:hover{background:rgba(20,16,12,.6); transform:rotate(-2deg) scale(1.04)}

  .hint{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:19;
    font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; opacity:.7;
    text-shadow:0 1px 6px rgba(0,0,0,.6);
  }

  /* progress dots for the featured queue */
  .dots{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:20; display:flex; gap:8px}
  .dots i{width:8px; height:8px; border-radius:50%; background:var(--chrome); opacity:.35; transition:opacity .3s, transform .3s}
  .dots i.on{opacity:1; transform:scale(1.3)}

  /* ---------- navigation overlay ---------- */
  .nav{
    position:fixed; inset:0; z-index:40; display:grid; place-items:center;
    background:rgba(13,11,9,.82); backdrop-filter:blur(10px);
    transform:translateY(100%); opacity:0; pointer-events:none;
    transition:transform .65s cubic-bezier(.22,1,.36,1), opacity .45s ease;
  }
  .nav.open{transform:translateY(0); opacity:1; pointer-events:auto}
  .nav ul{list-style:none; text-align:center}
  .nav a{
    display:block; font-family:Caveat,cursive; font-weight:700;
    font-size:clamp(2rem,6vh,3.2rem); color:var(--ink); text-decoration:none;
    padding:.35em 1em; transform:rotate(var(--r,0deg)); transition:transform .2s, color .2s;
  }
  .nav a:hover{color:#ef9438; transform:rotate(var(--r,0deg)) scale(1.06)}
  .nav li:nth-child(odd){--r:-.8deg} .nav li:nth-child(even){--r:.8deg}
  .nav .close{position:absolute; top:18px; right:22px; font-size:1.6rem; background:none; border:none; color:var(--ink); cursor:pointer}
  .nav small{display:block; margin-top:26px; font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; opacity:.6}

  /* ---------- drill-in (prototype stand-in for the artwork page) ---------- */
  .detail{
    position:fixed; inset:0; z-index:50; display:grid; place-items:center;
    background:rgba(13,11,9,.9); opacity:0; pointer-events:none; transition:opacity .4s ease;
  }
  .detail.open{opacity:1; pointer-events:auto}
  .detail .card{
    max-width:min(680px, 92vw); max-height:88vh; overflow:auto;
    background:#fbf6ec; color:#2e2a26; border-radius:16px; padding:0 0 22px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .detail img{width:100%; height:auto; display:block; border-radius:16px 16px 0 0}
  .detail .body{padding:18px 26px 0}
  .detail h2{font-family:Caveat,cursive; font-size:2.2rem}
  .detail .meta{font-size:.8rem; color:#6b655e; margin-bottom:10px}
  .detail p{font-size:.92rem; line-height:1.6}
  .detail .row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
  .detail .pill{
    border:2px solid #2e2a26; border-radius:999px; padding:7px 16px;
    font-size:.82rem; font-weight:600; background:#fff; cursor:pointer; box-shadow:2px 2px 0 #2e2a26;
  }
  .detail .pill:hover{background:#ef9438}
  .detail .close{position:absolute; top:14px; right:18px; font-size:1.5rem; background:none; border:none; color:#fbf6ec; cursor:pointer}

  /* ---------- reduced motion: static crossfade-free gallery ---------- */
  @media (prefers-reduced-motion: reduce){
    .slide{transition:none}
    .slide.active img{animation:none}
    body.idle .chrome{opacity:1} body.idle{cursor:auto}
  }
</style>
</head>
<body>

<div class="stage" id="stage" aria-live="polite"></div>
<div class="vignette"></div>

<div class="wordmark chrome">JujuLand</div>
<div class="hint chrome" id="hint">click the art to step inside · scroll down for the menu</div>

<div class="caption chrome" id="caption" role="button" tabindex="0" aria-label="Open this artwork">
  <div class="t" id="capTitle"></div>
  <div class="m" id="capMeta"></div>
</div>

<div class="dots chrome" id="dots"></div>

<div class="controls chrome">
  <button class="btn" id="prev" aria-label="Previous artwork">◀</button>
  <button class="btn" id="pause" aria-label="Pause slideshow">⏸</button>
  <button class="btn" id="next" aria-label="Next artwork">▶</button>
</div>

<button class="navglyph chrome" id="navOpen" aria-label="Open navigation">✳︎ menu</button>

<nav class="nav" id="nav" aria-hidden="true">
  <button class="close" id="navClose" aria-label="Close navigation">✕</button>
  <ul>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="attic.html">The Attic</a></li>
    <li><a href="wallpapers.html">Wallpaper Studio</a></li>
    <li><a href="techniques.html">Techniques</a></li>
    <li><a href="journal.html">Journal</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="support.html">Support</a></li>
    <li><a href="portfolio.html">Portfolio Mode →</a></li>
  </ul>
  <small>prototype — all destinations are live demo pages</small>
</nav>

<div class="detail" id="detail" aria-hidden="true">
  <button class="close" id="detailClose" aria-label="Back to the canvas">✕</button>
  <div class="card">
    <img id="dImg" alt="">
    <div class="body">
      <h2 id="dTitle"></h2>
      <div class="meta" id="dMeta"></div>
      <p id="dStory"></p>
      <div class="row">
        <button class="pill" onclick="location.href='gallery.html'">Open in the gallery →</button>
        <button class="pill" onclick="location.href='wallpapers.html'">⬇ Get wallpaper</button>
        <button class="pill" onclick="location.href='techniques.html'">▶ Watch time-lapse</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= data ================= */
const WORKS = [
  {src:"art/starlight-fox.jpg", title:"Starlight Fox", year:2026, medium:"Procreate · iPad",
   story:"A fox made of constellations, drawn after the meteor shower. The stars in its tail took a whole evening — worth it.",
   ox:"50%", oy:"38%", tx:"1.5%", ty:"-1.5%"},
  {src:"art/umbrella-parade.jpg", title:"The Umbrella Parade", year:2026, medium:"Procreate · iPad",
   story:"Rainy days are only gloomy if you forget your umbrella. I counted eleven puddle reflections.",
   ox:"50%", oy:"55%", tx:"-1.5%", ty:"1.2%"},
  {src:"art/deep-sea-library.jpg", title:"The Deep Sea Library", year:2025, medium:"Photoshop · Cintiq",
   story:"The whale is the librarian. Nobody is allowed to eat the books. The lanterns are bioluminescent bookmarks.",
   ox:"42%", oy:"50%", tx:"2%", ty:"-1%"},
  {src:"art/dragon-friend.jpg", title:"Dragon Friend", year:2025, medium:"Procreate · iPad",
   story:"He curls around the chimney to keep warm and tells her about the old sky. From my dragon phase — the good one.",
   ox:"58%", oy:"45%", tx:"-2%", ty:"1.5%"},
];

/* ================= config ================= */
const q = new URLSearchParams(location.search);
const SLIDE_MS = Math.max(3000, (parseFloat(q.get("slide")) || 20) * 1000); // ?slide=8 for a quick demo
document.documentElement.style.setProperty("--slide-ms", SLIDE_MS + "ms");
const FADE_MS = 1800;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= slideshow engine ================= */
const stage = document.getElementById("stage");
const capTitle = document.getElementById("capTitle");
const capMeta  = document.getElementById("capMeta");
const dotsEl   = document.getElementById("dots");
const prevBtn  = document.getElementById("prev");
const nextBtn  = document.getElementById("next");
const pauseBtn = document.getElementById("pause");

let history_ = [0];       // indices shown this session, in order
let hPos = 0;             // position within history_
let queueNext = 1;        // next unshown index in the featured queue
let paused = false;
let timer = null;

WORKS.forEach(() => {
  const d = document.createElement("div");
  d.className = "slide";
  const im = document.createElement("img");
  d.appendChild(im);
  stage.appendChild(d);
});
const slides = [...stage.children];
WORKS.forEach((_,i)=>{
  const dot = document.createElement("i");
  dot.addEventListener("click", ()=>jumpTo(i));
  dotsEl.appendChild(dot);
});

function show(idx, {push=true} = {}){
  const w = WORKS[idx];
  const slide = slides[idx];
  const img = slide.querySelector("img");
  if(!img.src){ img.src = w.src; img.alt = w.title; }
  img.style.setProperty("--ox", w.ox); img.style.setProperty("--oy", w.oy);
  img.style.setProperty("--tx", w.tx); img.style.setProperty("--ty", w.ty);

  slides.forEach(s=>s.classList.remove("active"));
  // restart the Ken Burns animation
  void slide.offsetWidth;
  slide.classList.add("active");

  capTitle.textContent = w.title;
  capMeta.textContent  = `${w.medium} · ${w.year}`;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle("on", i===idx));
  prevBtn.disabled = hPos <= 0;

  if(push){
    history_ = history_.slice(0, hPos+1);
    if(history_[hPos] !== idx){ history_.push(idx); hPos++; }
  }
  schedule();
  preloadUpcoming();
}

function nextIndex(){
  if(hPos < history_.length - 1) return history_[hPos+1];       // walk forward in history
  const n = queueNext % WORKS.length; queueNext++; return n;     // or extend the queue
}
function advance(){ const n = nextIndex(); if(hPos < history_.length-1) hPos++; show(n); }
function back(){ if(hPos > 0){ hPos--; show(history_[hPos], {push:false}); } }
function jumpTo(i){ show(i); }

function schedule(){
  clearTimeout(timer);
  if(!paused && !REDUCED) timer = setTimeout(advance, SLIDE_MS);
}
function preloadUpcoming(){
  const n = queueNext % WORKS.length;
  const im = slides[n].querySelector("img");
  if(!im.src){ im.src = WORKS[n].src; im.alt = WORKS[n].title; }
}

/* ================= controls ================= */
nextBtn.addEventListener("click", e=>{e.stopPropagation(); advance();});
prevBtn.addEventListener("click", e=>{e.stopPropagation(); back();});
pauseBtn.addEventListener("click", e=>{
  e.stopPropagation(); paused = !paused;
  pauseBtn.textContent = paused ? "▶" : "⏸";
  pauseBtn.setAttribute("aria-label", paused ? "Resume slideshow" : "Pause slideshow");
  schedule();
});

/* ================= drill-in ================= */
const detail = document.getElementById("detail");
function openDetail(){
  const w = WORKS[history_[hPos]];
  document.getElementById("dImg").src = w.src;
  document.getElementById("dImg").alt = w.title;
  document.getElementById("dTitle").textContent = w.title;
  document.getElementById("dMeta").textContent = `${w.medium} · ${w.year}`;
  document.getElementById("dStory").textContent = w.story;
  detail.classList.add("open"); detail.setAttribute("aria-hidden","false");
  clearTimeout(timer); // hold still while reading
}
function closeDetail(){
  detail.classList.remove("open"); detail.setAttribute("aria-hidden","true");
  schedule();
}
stage.addEventListener("click", openDetail);
document.getElementById("caption").addEventListener("click", openDetail);
document.getElementById("detailClose").addEventListener("click", closeDetail);
detail.addEventListener("click", e=>{ if(e.target === detail) closeDetail(); });

/* ================= navigation overlay ================= */
const nav = document.getElementById("nav");
function openNav(){ nav.classList.add("open"); nav.setAttribute("aria-hidden","false"); }
function closeNav(){ nav.classList.remove("open"); nav.setAttribute("aria-hidden","true"); }
document.getElementById("navOpen").addEventListener("click", e=>{ e.stopPropagation(); openNav(); });
document.getElementById("navClose").addEventListener("click", closeNav);
nav.addEventListener("click", e=>{ if(e.target === nav) closeNav(); });

/* scroll down = the menu slides up over the canvas; scroll up = it slides away */
let navLock = false;
function navLockBrief(){ navLock = true; setTimeout(()=>navLock = false, 750); }
addEventListener("wheel", e=>{
  if(navLock || detail.classList.contains("open")) return;
  if(e.deltaY > 20 && !nav.classList.contains("open")){ openNav(); navLockBrief(); }
  else if(e.deltaY < -20 && nav.classList.contains("open")){ closeNav(); navLockBrief(); }
}, {passive:true});
let touchY = null;
addEventListener("touchstart", e=>{ touchY = e.touches[0].clientY; }, {passive:true});
addEventListener("touchmove", e=>{
  if(touchY === null || navLock || detail.classList.contains("open")) return;
  const dy = touchY - e.touches[0].clientY;   // positive = swipe up = "scroll down"
  if(dy > 40 && !nav.classList.contains("open")){ openNav(); navLockBrief(); }
  else if(dy < -40 && nav.classList.contains("open")){ closeNav(); navLockBrief(); }
}, {passive:true});
addEventListener("touchend", ()=>{ touchY = null; }, {passive:true});

/* ================= keyboard ================= */
addEventListener("keydown", e=>{
  if(e.key === "Escape"){ closeDetail(); closeNav(); }
  if(e.key === "ArrowDown" && !detail.classList.contains("open")) openNav();
  if(e.key === "ArrowUp") closeNav();
  if(nav.classList.contains("open") || detail.classList.contains("open")) return;
  if(e.key === "ArrowRight") advance();
  if(e.key === "ArrowLeft") back();
  if(e.key === " "){ e.preventDefault(); pauseBtn.click(); }
  if(e.key === "Enter" && document.activeElement === document.body) openDetail();
});

/* ================= idle chrome fade ================= */
let idleT = null;
function wake(){
  document.body.classList.remove("idle");
  document.getElementById("hint").style.opacity = "";
  clearTimeout(idleT);
  idleT = setTimeout(()=>document.body.classList.add("idle"), 4000);
}
["mousemove","touchstart","keydown"].forEach(ev=>addEventListener(ev, wake, {passive:true}));
wake();

/* hide the hint after the first interaction cycle */
setTimeout(()=>document.getElementById("hint").style.opacity = ".35", 12000);

/* ================= go ================= */
show(0);
</script>
</body>
</html>
